<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Operations</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e8eef7;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 600px;
            padding: 50px;
            background: white;
            border-radius: 35px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }

        label {
            display: block;
            margin-bottom: 12px;
            font-family: Georgia, serif;
            font-size: 26px;
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 70px;
            margin-bottom: 38px;
            padding: 15px;
            font-size: 24px;
            border: 3px solid #bbb;
            border-radius: 15px;
        }

        #result {
            font-weight: bold;
            background: #f5f5f5;
        }

        .buttons {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 18px;
        }

        button {
            padding: 16px 27px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(135deg, #ff3b3b, #e60000);
            color: white;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="container">

        <label for="num1">Enter a value :</label>
        <input type="number" id="num1" value="20">

        <label for="num2">Enter a value :</label>
        <input type="number" id="num2" value="10">

        <label for="result">Result :</label>
        <input type="text" id="result" value="30" readonly>

        <div class="buttons">
            <button onclick="addition()">Addition</button>
            <button onclick="subtract()">Subtract</button>
            <button onclick="multiply()">Multiply</button>
            <button onclick="division()">Division</button>
            <button onclick="modulus()">Modulus</button>
            <button onclick="exponential()">Exponential</button>
        </div>

    </div>

    <script>

        function getValues() {
            let a = Number(document.getElementById("num1").value);
            let b = Number(document.getElementById("num2").value);

            return [a, b];
        }

        function addition() {
            let [a, b] = getValues();

            document.getElementById("result").value = a + b;
        }

        function subtract() {
            let [a, b] = getValues();

            document.getElementById("result").value = a - b;
        }

        function multiply() {
            let [a, b] = getValues();

            document.getElementById("result").value = a * b;
        }

        function division() {
            let [a, b] = getValues();

            if (b === 0) {
                document.getElementById("result").value = "Cannot divide by zero";
            } else {
                document.getElementById("result").value = a / b;
            }
        }

        function modulus() {
            let [a, b] = getValues();

            document.getElementById("result").value = a % b;
        }

        function exponential() {
            let [a, b] = getValues();

            document.getElementById("result").value = a ** b;
        }

    </script>

</body>
</html>
